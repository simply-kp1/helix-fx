name: Helix FX

on:
  workflow_dispatch:

schedule:
  - cron: "0,30 6-17 * * 1-5"
    timezone: "Europe/London"

  - cron: "0 18 * * 1-5"
    timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: helix-fx
  cancel-in-progress: false

jobs:
  helix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Helix
        env:
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENVIRONMENT: practice
        run: python main.py --mode practice --once

      - name: Save Helix state to GitHub
        if: always()
        run: |
          git config user.name "helix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/helix_state.json
          git add state/proposals.json
          git add state/control.json

          if git diff --cached --quiet; then
            echo "No Helix state changes to commit"
            exit 0
          fi

          git commit -m "Update Helix trading state"

          git pull --rebase origin main

          git push origin main