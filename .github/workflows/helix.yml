name: Helix FX

on:
  workflow_dispatch:
  schedule:
    # GitHub cron runs in UTC — no timezone key supported.
    # This window covers 06:00-18:00 Europe/London year-round:
    #   - Winter (GMT):   05:00-18:59 UTC = 05:00-18:59 London
    #   - Summer (BST):   05:00-18:59 UTC = 06:00-19:59 London
    # main.py's own session logic ignores ticks outside 06:00-18:00 London,
    # so the extra bookend ticks are safe (cheap no-ops).
    - cron: "0,30 5-18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: helix-fx
  cancel-in-progress: false

jobs:
  helix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Helix
        env:
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENVIRONMENT: practice
        run: python main.py --mode practice --once

      - name: Save Helix state to GitHub
        if: always()
        run: |
          git config user.name "helix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/helix_state.json
          git add state/proposals.json
          git add state/control.json

          if git diff --cached --quiet; then
            echo "No Helix state changes to commit"
            exit 0
          fi

          git commit -m "Update Helix trading state"

          git pull --rebase origin main

          git push origin main
