# Auto-deploy to Fly.io on every push to main.
#
# Setup (one-time):
#   1. Create a Fly deploy token, scoped to just this app:
#        flyctl tokens create deploy -a helix-fx -x 8760h
#      (8760h = 1 year; extend or rotate as you like)
#   2. In GitHub → repo Settings → Secrets and variables → Actions →
#      "New repository secret":
#        Name:  FLY_API_TOKEN
#        Value: (paste the token from step 1)
#   3. Push. This workflow runs and deploys.
#
# The token only has permission to deploy to `helix-fx`. It cannot read
# your OANDA secrets (those live on Fly, set via `flyctl secrets set`).

name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual triggers from the Actions tab

# Cancel in-flight deploys when a newer push arrives on main.
concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
