# fly.toml app configuration file generated for helix-fx on 2026-08-17T13:54:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'helix-fx'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  HELIX_DATA_DIR = '/data'
  HELIX_MODE = 'paper'
  OANDA_ENVIRONMENT = 'practice'

[[mounts]]
  source = 'helix_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
