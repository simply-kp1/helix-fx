broker:
  name: oanda
  account_id: "${OANDA_ACCOUNT_ID}"
  api_key: "${OANDA_API_KEY}"
  environment: "${OANDA_ENVIRONMENT}"

trading:
  instruments:
    - DE30_EUR              # DAX 40 CFD (OANDA still uses the DE30 code)
  risk_percent: 1.0         # % of account balance to risk per trade
  max_trades_per_day: 3

strategy:
  ema_period: 100
  atr_period: 14
  atr_buffer_pct: 0.05      # 5% of daily ATR as SL buffer
  min_rr: 1.5               # Minimum risk-to-reward ratio

session:
  # Xetra opens 09:00 CET / 08:00 London year-round.
  # The two IB M30 bars are 08:00 and 08:30 London (Xetra 09:00 / 09:30 CET).
  # Session end at 17:00 London gives a 30-min buffer past Xetra close (16:30 London).
  ib_start_hour: 8
  ib_end_hour: 9
  session_end_hour: 17
  timezone: "Europe/London"
